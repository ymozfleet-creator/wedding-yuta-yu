<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>出欠管理 | Wedding Invitation</title>
<link rel="stylesheet" href="css/admin.css?v=11">
</head>
<body>
<header class="bar">
  <h1>出欠管理</h1>
  <span class="bar__names" id="names"></span>
  <button type="button" class="link" id="logoutBtn" hidden>ログアウト</button>
</header>

<main class="wrap">
  <p class="demo" id="demoNote" hidden>お試しモードです（保存先が未設定のため、サンプルの回答を表示しています）。</p>

  <!-- ログイン -->
  <form class="card login" id="loginForm" novalidate hidden>
    <h2>新郎新婦ログイン</h2>
    <label>メールアドレス<input type="email" id="loginEmail" autocomplete="username" required maxlength="120"></label>
    <label>パスワード<input type="password" id="loginPass" autocomplete="current-password" required maxlength="128"></label>
    <button type="submit" class="btn" id="loginBtn">ログイン</button>
    <p class="err" id="loginErr"></p>
  </form>

  <!-- 一覧 -->
  <section id="dash" hidden>
    <div class="stats" id="stats"></div>

    <div class="tools">
      <div class="filters">
        <label>出欠
          <select id="fAtt"><option value="">すべて</option><option value="attend">ご出席</option><option value="decline">ご欠席</option></select>
        </label>
        <label>区分
          <select id="fSide"><option value="">すべて</option><option value="groom">新郎側</option><option value="bride">新婦側</option></select>
        </label>
        <label>検索<input type="search" id="fText" placeholder="名前・メール" maxlength="50"></label>
        <label class="chk"><input type="checkbox" id="fDup"> 古い重複回答も表示</label>
      </div>
      <div class="actions">
        <button type="button" class="btn btn--ghost" id="reloadBtn">再読み込み</button>
        <button type="button" class="btn" id="csvBtn">CSVダウンロード</button>
      </div>
    </div>
    <p class="note">同じメールアドレスから複数回答があった場合は、最新の回答のみを集計します。</p>

    <div class="table-wrap">
      <table class="tbl">
        <thead>
          <tr>
            <th>回答日時</th><th>出欠</th><th>区分</th><th>お名前</th><th>ふりがな</th><th>人数</th>
            <th>同伴者</th><th>アレルギー等</th><th>メール</th><th>電話</th><th>住所</th><th>メッセージ</th><th></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <p class="empty" id="empty" hidden>まだ回答はありません</p>
    </div>
    <p class="err" id="loadErr"></p>
  </section>
</main>

<script src="js/config.js?v=11"></script>
<script src="js/admin.js?v=11"></script>
</body>
</html>
